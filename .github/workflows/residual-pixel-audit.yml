name: Pixel inspection of 70 residual matches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/residual-pixel-audit.yml"
      - "scripts/residual_pixel_casebook.py"
      - "scripts/residual_pixel_diagnostics.py"
      - "tests/test_residual_pixel_diagnostics.py"
      - "requirements.lock.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact environment
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip freeze > pixel_environment.txt
          diff -u requirements.lock.txt pixel_environment.txt
      - name: Test cropped-image comparisons
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
      - name: Recompute original sample, residual categories and crop-level pixel equality
        run: python scripts/residual_pixel_casebook.py
      - name: Verify original study and identifier baseline outputs byte for byte
        run: |
          python scripts/verify_results.py out_confirm/confirm_summary.json
          echo "e03b5b07f44997b9017393a1eb0871bde1fd57c5299fe5818538e038224269e3  out_confirm/confirm_summary.json" | sha256sum -c -
          echo "12444432bff93d75e3117a7e81eca9b764f7928bfd92a9a13685d63863004b58  out_identifier/identifier_summary.json" | sha256sum -c -
          echo "6d18a92e487d3505431d9c9d1bf02beff85ea1d5b705d4556e7c06f2522781f3  out_identifier/identifier_action_metrics.csv" | sha256sum -c -
      - name: Validate pixel-case cohort and absence of raw media
        run: |
          python - <<'PY'
          import csv,json,pathlib
          d=pathlib.Path("out_pixel")
          with (d/"residual_pixel_cases.csv").open(newline="",encoding="utf-8") as f:
              reader=csv.DictReader(f); cols=set(reader.fieldnames); rows=list(reader)
          assert len(rows)==70 and len({(r["demo"],r["turn"]) for r in rows})==70
          assert cols.isdisjoint({"text","xpath","uid","html_id","screenshot","url","raw_rgb","image"})
          summ=json.loads((d/"residual_pixel_summary.json").read_text())
          assert summ["case_n"]==70
          assert summ["competitor_counts"]["pixel_valid_comparisons"]==sum(int(r["valid_visual_competitor_n"]) for r in rows)
          print("PASS: complete 70-case pixel-level measurements, public schema")
          PY
      - name: Hash results
        if: always()
        run: |
          if test -f out_pixel/residual_pixel_summary.json; then
            sha256sum out_pixel/residual_pixel_summary.json out_pixel/residual_pixel_cases.csv > pixel_sha256.txt
            sha256sum out_residual/residual_summary.json out_residual/residual_70_cases.csv > residual_sha256.txt
          fi
      - name: Retain derived-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: residual-70-pixel-audit
          path: |
            out_pixel/residual_pixel_summary.json
            out_pixel/residual_pixel_cases.csv
            out_residual/residual_summary.json
            out_residual/residual_70_cases.csv
            pixel_sha256.txt
            residual_sha256.txt
            pixel_environment.txt
          if-no-files-found: warn
          retention-days: 90
