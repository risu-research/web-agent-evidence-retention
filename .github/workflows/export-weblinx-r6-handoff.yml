name: Export R6 second app and trace-audit complete handoff bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-weblinx-r6-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch both complete independently executed source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p export/R6/independent_runs/first export/R6/independent_runs/repeat
          gh run download 45064967915 -R risu-research/web-agent-evidence-retention -n weblinx-r6-django-real-db-trace -D export/R6/independent_runs/first
          gh run download 45064981005 -R risu-research/web-agent-evidence-retention -n weblinx-r6-django-real-db-trace -D export/R6/independent_runs/repeat
      - name: Assemble frozen reproducibility source and result bundle
        run: |
          mkdir -p export/R6/docs export/R6/scripts export/R6/results export/R6/tests export/R6/workflows
          cp README.md export/R6/
          cp docs/weblinx-r6-django-trace-{protocol,results}.md export/R6/docs/
          cp docs/weblinx-round5b-{flaskr-protocol,flaskr-results}.md export/R6/docs/
          cp docs/weblinx-round5b2-server-rejection-{protocol,results}.md export/R6/docs/
          cp scripts/weblinx_r6_django_trace.py scripts/weblinx_r6_audit_matrix.py scripts/weblinx_r6_compare.py export/R6/scripts/
          cp scripts/weblinx_round5b_flaskr.py scripts/weblinx_round5b_compare.py scripts/weblinx_round5b2_server_rejection.py export/R6/scripts/
          cp results/weblinx_r6_*.json results/weblinx_r6_*.csv export/R6/results/
          cp results/weblinx_round5b_flaskr_*.json results/weblinx_round5b_flaskr_*.csv export/R6/results/
          cp results/weblinx_round5b2_rejection_*.json results/weblinx_round5b2_rejection_*.csv export/R6/results/
          cp tests/test_weblinx_r6_trace.py export/R6/tests/
          cp .github/workflows/weblinx-r6-django-trace.yml .github/workflows/weblinx-r6-audit-questions.yml .github/workflows/weblinx-r6-repeat-compare.yml export/R6/workflows/
          python - <<'PY'
          import json,hashlib,pathlib
          base=pathlib.Path('export/R6')
          first=base/'independent_runs/first/out_round6/r6_django_summary.json'
          cases=base/'independent_runs/first/out_round6/r6_django_48.csv'
          assert hashlib.sha256(first.read_bytes()).hexdigest()=="2bd197d64449848229c84b7e58d09aa08398bbe44039523eb5efdb819d03002a"
          assert hashlib.sha256(cases.read_bytes()).hexdigest()=="00b13fb0591562c9cef4ffe609878e6dc7f8f2ba07de90dc8887050df0d6e6a3"
          reread=json.loads((base/'results/weblinx_r6_independent_repeat.json').read_text())
          audit=json.loads((base/'results/weblinx_r6_audit_matrix.json').read_text())
          assert reread['differences_n']==0 and reread['cases']==48
          assert audit['questions']['Q3_actual_mutating_HTTP_route']['trace_correct_n']==48
          assert audit['questions']['Q5_first_locator_return_or_error']['trace_correct_n']==48
          assert not any('trace.zip' in str(p) for p in base.rglob('*'))
          print('PASS: 48 fully source-backed Django cases and five independent audit questions')
          PY
      - name: Store explicit checksums and pinned provenance
        run: |
          cat > export/R6/HANDOFF.md <<'EOF'
          # R6 source-verified external Django and Playwright Trace study

          Official repo: https://github.com/risu-research/web-agent-evidence-retention

          This export includes source scripts, fixed protocols, two independent
          full 48-case Django results, a five-question direct-evidence audit,
          the cross-app Flaskr baseline, and repeat-validation JSON.

          Django 5.2.12 tag commit:
          4f382ca672f86dd4a1e4d071c91d0caad0e124b3
          Playwright: 1.65.2; Chromium: 159.0.8154.6
          Valid Django source runs: 45064967915 and 45064981005.
          Earlier setup/calibration runs were rejected and are identified
          in docs/weblinx-r6-django-trace-protocol.md.

          Original result: 48 trials, 16 intended A SQL changes,
          8 other B SQL changes, 24 no changes.
          All 48 authentic Trace POST route labels match independent WSGI.
          All 48 action selectors and first action statuses were found in Trace.
          Direct isTrusted receiver and independent SQLite readbacks require
          separate evidence instruments, although Trace DOM snapshots can be
          investigated manually. The current scorer evaluates only explicit
          machine-readable evidence, not human DOM reconstruction.

          The compact packet sizes and actual Trace ZIP sizes have different
          evidence coverage; never treat their size ratio as equal-function
          compression.

          No raw Playwright Trace ZIP, user account data or local browser
          credential/session is distributed. All accounts are synthetic.
          The original manuscript and Zenodo DOI remain unchanged.
          EOF
          (
            cd export/R6
            find . -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt
          )
          cd export
          zip -q -r -9 TRUSTMORE_ROUND6_SECOND_APP_TRACE_AUDIT_VERIFIED.zip R6
          unzip -t TRUSTMORE_ROUND6_SECOND_APP_TRACE_AUDIT_VERIFIED.zip | tail -1
      - name: Upload exact verified handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TRUSTMORE-ROUND6-SECOND-APP-TRACE-AUDIT-VERIFIED
          path: export/TRUSTMORE_ROUND6_SECOND_APP_TRACE_AUDIT_VERIFIED.zip
          if-no-files-found: error
          retention-days: 90
