name: Publish valid R6 Django 48-case source and Trace results

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-weblinx-r6-django.yml"

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download first control-passing second-app result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45064967915 -R risu-research/web-agent-evidence-retention -n weblinx-r6-django-real-db-trace -D source_run
      - name: Verify exact original results and source-control validity
        run: |
          echo "2bd197d64449848229c84b7e58d09aa08398bbe44039523eb5efdb819d03002a  source_run/out_round6/r6_django_summary.json" | sha256sum -c -
          echo "00b13fb0591562c9cef4ffe609878e6dc7f8f2ba07de90dc8887050df0d6e6a3  source_run/out_round6/r6_django_48.csv" | sha256sum -c -
          python - <<'PY'
          import csv,json
          s=json.load(open("source_run/out_round6/r6_django_summary.json"))
          with open("source_run/out_round6/r6_django_48.csv",newline="") as f:
              reader=csv.DictReader(f);fields=set(reader.fieldnames);rows=list(reader)
          assert s['predeclared_cases']['count']==len(rows)==48
          assert len({(r['operation'],r['locator'],r['condition']) for r in rows})==48
          assert s['total']['effects']=={'A':16,'B':8,'none':24}
          assert s['total']['event_row_vs_SQL_mismatch']==6
          assert s['trace']['server_POST_record_correct_n']==48
          assert all(r['sqlite_effect_record']=='A' for r in rows if r['condition']=='baseline')
          assert all(r['sqlite_effect_record']=='none' for r in rows if r['condition']=='overlay_standard')
          assert s['raw_trace_published'] is False
          assert fields.isdisjoint({'password','cookie','session','raw_trace','raw_html','user_text','sqlite_dump'})
          print('R6_VALID_UPSTREAM_SOURCE_CONTROLS',len(rows))
          PY
      - name: Commit exact categorical source evidence
        run: |
          cp source_run/out_round6/r6_django_summary.json results/weblinx_r6_django_summary.json
          cp source_run/out_round6/r6_django_48.csv results/weblinx_r6_django_cases.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_r6_django_summary.json results/weblinx_r6_django_cases.csv
          if ! git diff --cached --quiet; then
            git commit -m "Archive second-app Django 48 actual committed SQL and raw Trace-derived evidence results"
            git push origin HEAD:main
          fi
