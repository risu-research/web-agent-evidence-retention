name: R3D site-native proxy paired bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-continuity-r3d-bootstrap.yml"
      - "scripts/weblinx_continuity_r3d_bootstrap.py"
      - "results/weblinx_continuity_r3d_cases.csv"

permissions:
  contents: write

jobs:
  paired_bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original derived 86-case source file
        run: |
          echo "234352ddb7656d7f8d8f60a65f5222fc971f37a6dea0f1b983bfb6dc54646e61  results/weblinx_continuity_r3d_cases.csv" | sha256sum -c -
      - name: Bootstrap all 75 proxies by demonstration
        run: python scripts/weblinx_continuity_r3d_bootstrap.py
      - name: Validate fixed counts and observed estimates
        run: |
          python - <<'PY'
          import json
          x=json.load(open("results/weblinx_continuity_r3d_cluster_bootstrap.json"))
          assert x["selected_actions"]==75 and x["demonstrations"]==31
          assert x["replicates"]==5000 and x["seed"]==2026112239
          m=x["metrics"]
          assert abs(m["paired_replay_minus_canonical"]["estimate"]-8/75)<1e-12
          assert m["paired_replay_minus_canonical"]["ci95"][0]<=8/75<=m["paired_replay_minus_canonical"]["ci95"][1]
          print("PASS: demo-cluster bootstrap from all 75 R3D cases")
          PY
      - name: Publish complete bootstrap record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_continuity_r3d_cluster_bootstrap.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 31-demo uncertainty for paired XPath proxy recovery"
            git push origin HEAD:main
          fi
