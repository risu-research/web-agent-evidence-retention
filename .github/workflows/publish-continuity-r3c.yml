name: Preserve original R3C executed XPath source results

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-continuity-r3c.yml"

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve complete successful frozen R3C measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45057156651 -R risu-research/web-agent-evidence-retention -n weblinx-r3c-replay-xpath-source-check -D source_run
      - name: Verify original hashes, all 600 rows and no literal locators
        run: |
          echo "39ebd980e586d277c9d9c9f6c9e5eefdbcc127cc1b895f86531809b9890c2d0d  source_run/out_continuity_r3c/r3c_summary.json" | sha256sum -c -
          echo "3b7b48d0dcec1f681ee3ffb4888533c76ec524cbb30130c08d493deef5add71b  source_run/out_continuity_r3c/r3c_action_xpath_600.csv" | sha256sum -c -
          python - <<'PY'
          import csv,json
          folder="source_run/out_continuity_r3c/"
          with open(folder+"r3c_action_xpath_600.csv",newline="") as f:
              reader=csv.DictReader(f); cols=set(reader.fieldnames);rows=list(reader)
          s=json.load(open(folder+"r3c_summary.json"))
          assert len(rows)==600
          assert sum(s["current_expression_results"].values())==600
          assert s["source_unique_target_recovered_n"]==589
          assert s["site_native_proxy_eligible_n"]==75
          assert s["browser_action_reexecution_measured"] is False
          assert s["logical_element_identity_independently_adjudicated"] is False
          assert cols.isdisjoint({"xpath","uid","url","html","text","site_id","source_doc","event_target"})
          print("PASS: 600 source XPath interpretations with no raw values")
          PY
      - name: Retain original measured dataset without a release
        run: |
          cp source_run/out_continuity_r3c/r3c_summary.json results/weblinx_continuity_r3c_summary.json
          cp source_run/out_continuity_r3c/r3c_action_xpath_600.csv results/weblinx_continuity_r3c_actions.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_continuity_r3c_*
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified 600-action replay XPath syntax and next-page outcomes"
            git push origin HEAD:main
          fi
