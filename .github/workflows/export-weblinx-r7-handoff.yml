name: Export verified R7 true DOM Trace and packet auditor handoff ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-weblinx-r7-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve first complete accepted original R7 source execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/R7/independent_runs/first
          gh run download 45067176933 -R risu-research/web-agent-evidence-retention -n weblinx-r7-blind-dom-trace-vs-packet -D bundle/R7/independent_runs/first
      - name: Retrieve complete independently repeated source execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/R7/independent_runs/repeat
          gh run download 45067470635 -R risu-research/web-agent-evidence-retention -n weblinx-r7-repeated-blind-dom-audit -D bundle/R7/independent_runs/repeat
      - name: Preserve studies, audits, code, scores and controls
        run: |
          mkdir -p bundle/R7/docs bundle/R7/scripts bundle/R7/tests bundle/R7/results bundle/R7/workflows
          cp README.md bundle/R7/
          cp docs/weblinx-r7-dom-auditor-{protocol,results}.md bundle/R7/docs/
          cp docs/weblinx-r6-django-trace-{protocol,results}.md bundle/R7/docs/
          cp scripts/weblinx_r7_trace_probe.py scripts/weblinx_r7_trace_dom_auditor.py scripts/weblinx_r7_compare_auditors.py scripts/weblinx_r7_compare_repeats.py scripts/weblinx_r6_django_trace.py bundle/R7/scripts/
          cp tests/test_weblinx_r7_trace_dom_auditor.py tests/test_weblinx_r7_archived.py tests/test_weblinx_r6_trace.py bundle/R7/tests/
          cp results/weblinx_r7_DOM_vs_packets_48.csv results/weblinx_r7_DOM_vs_packets_summary.json results/weblinx_r7_independent_repeat.json bundle/R7/results/
          cp results/weblinx_r6_django_cases.csv results/weblinx_r6_django_summary.json results/weblinx_r6_audit_matrix.json bundle/R7/results/
          cp .github/workflows/weblinx-r7-probe.yml .github/workflows/weblinx-r7-dom-compare.yml .github/workflows/weblinx-r7-independent-repeat.yml bundle/R7/workflows/
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('bundle/R7')
          first=root/'independent_runs/first/out_round7'
          repeat=root/'independent_runs/repeat/out_round7'
          expected=[
           (first/'r7_trace_DOM_vs_packets_summary.json','2a72e1fae82360ca0ef255a6e00cbc6895ed0772048b80c1ea0fde0a5efa749c'),
           (first/'r7_trace_DOM_vs_packets_48.csv','706fbd149da6de28fb62c28bb9d10dc531a1aff60022cb2e6e82fc6a604c77da'),
           (repeat/'r7_trace_DOM_vs_packets_summary.json','538dc8767062d83f18011e0b9a2679699fa422bcdae7d595d8b25e92ac6f095c'),
           (repeat/'r7_trace_DOM_vs_packets_48.csv','aaaef1780e40265148d5f27d0f8488b5c36057007335a13894e28f6a079fd8e3'),
           (root/'results/weblinx_r7_independent_repeat.json','6e766f5dcd5f6f374c5e4bcbc3e191a203a13b25d6800b8aeac39d62054a6860'),
          ]
          for path,sha in expected:
              assert hashlib.sha256(path.read_bytes()).hexdigest()==sha,(path,sha)
          compare=json.loads((root/'results/weblinx_r7_independent_repeat.json').read_text())
          assert compare['cases']==48 and compare['different_fields_n']==0
          assert compare['stable_fields_compared_per_case']==50
          original=json.loads((first/'r7_trace_DOM_vs_packets_summary.json').read_text())
          assert original['DOM_snapshot_totals']['subtree_ref_failures']==0
          assert original['DOM_snapshot_totals']['subtree_refs_resolved']==14825
          assert original['evaluations']['trace']['Q4_SQLite_effect']['correct']==48
          assert original['evaluations']['effect']['Q4_SQLite_effect']['correct']==48
          assert not any(p.name.endswith('trace.zip') for p in root.rglob('*'))
          print('R7_VERIFIED_ALL_48_TWO_RUNS_50_FIELDS_SOURCE_ONLY')
          PY
      - name: Add honest handoff, source manifest and verified ZIP
        run: |
          cat > bundle/R7/HANDOFF.md <<'EOF'
          # R7 authentic Playwright DOM Trace and selective packet auditor

          Complete sources:
          https://github.com/risu-research/web-agent-evidence-retention

          This ZIP contains actual derived categorical evidence, archived
          original and repeat full 48-case runs, fixed preregistration,
          native DOM-subtree-reference reconstruction code, blind auditor
          code, unit tests and deterministic GitHub Actions reproduction.

          Source webapp: unmodified Django Admin / auth.User,
          Django 5.2.12 tag SHA 4f382ca672f86dd4a1e4d071c91d0caad0e124b3.
          Playwright 1.65.2, Chromium 159.0.8154.6.

          Main result: real native Playwright Trace DOM auditor correctly
          inferred event row, mutating server POST route, screen-visible
          effect label and first API action outcome in all 48 controlled cases,
          when joined against independent event/WSGI/SQL truth.
          Full packets carrying the actual SQLite measurement also yielded
          48 correct answers per question. Both runs reproduce all stable
          categorical fields, with no mismatch across 50 per case.

          Trace's UI-based database inference is NOT an authenticated
          database readback. Packet Q4 includes the separately queried SQL
          truth by construction. These two approaches differ in provenance.
          No general accuracy advantage for selective packets was shown.
          Actual Trace ZIP is much larger but has much broader information
          coverage. Cost comparisons are NOT equivalent-function ratios.

          Original raw browser Trace ZIPs and browser session data are
          deliberately discarded after analysis and not republished. All
          source data uses dummy accounts. Re-execute workflows to construct
          authentic Trace again. Main manuscript and DOI remain unchanged.
          EOF
          (
            cd bundle/R7
            find . -type f ! -name SHA256_MANIFEST.txt -print0 | sort -z | xargs -0 sha256sum > SHA256_MANIFEST.txt
          )
          cd bundle
          zip -q -r -9 TRUSTMORE_R7_DOM_TRACE_VS_SELECTIVE_EVIDENCE_VERIFIED.zip R7
          unzip -t TRUSTMORE_R7_DOM_TRACE_VS_SELECTIVE_EVIDENCE_VERIFIED.zip | tail -1
      - name: Export evidence-only complete project handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TRUSTMORE-R7-DOM-TRACE-SELECTIVE-EVIDENCE-VERIFIED
          path: bundle/TRUSTMORE_R7_DOM_TRACE_VS_SELECTIVE_EVIDENCE_VERIFIED.zip
          retention-days: 90
          if-no-files-found: error
