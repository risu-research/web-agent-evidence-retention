name: R8B independent second complete Django and Trace execution

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r8b-independent-repeat.yml"
      - "scripts/weblinx_r8_server_divergence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-r8b:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independently fresh exact original test environment
        run: |
          python -m pip install 'Django==5.2.12' 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > independent_r8b_environment.txt
      - name: Verify original and corrected audit code
        run: |
          python -m unittest discover -s tests -p 'test_weblinx_r7_trace_dom_auditor.py' -v
          python -m unittest discover -s tests -p 'test_weblinx_r8_server_divergence.py' -v
          python -m unittest discover -s tests -p 'test_weblinx_r8b_transactional.py' -v
      - name: Reexecute all 12 actual native Django browser workflows
        run: python scripts/weblinx_r8b_transactional.py
      - name: Independent outcomes must pass all six transactional/pixel/SQL gates
        run: |
          python - <<'PY'
          import json,csv
          s=json.load(open('out_round8b/r8b_summary.json'))
          with open('out_round8b/r8b_12_source_cases.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==12 and s['equivalent_pairs']==6
          assert s['transactional_network_pairs_equal']==6
          assert s['packet_Q6_correct']==12
          assert s['trace_Q6']=={'abstain':12}
          assert s['snapshot_totals']['failures']==0
          assert all(x['q2_click']==x['q3_POST']==x['q4_UI_effect']=='A' for x in rows)
          print('R8B_INDEPENDENT_ALL_CASES_PASS')
          PY
      - name: Hash exact independent outputs
        if: always()
        run: |
          if test -f out_round8b/r8b_summary.json; then
            sha256sum out_round8b/r8b_summary.json out_round8b/r8b_12_source_cases.csv > independent_r8b_sha256.txt
          fi
      - name: Archive only derived categorical outcomes and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r8b-independent-second-real-execution
          path: |
            out_round8b/r8b_summary.json
            out_round8b/r8b_12_source_cases.csv
            independent_r8b_sha256.txt
            independent_r8b_environment.txt
          if-no-files-found: warn
          retention-days: 90
