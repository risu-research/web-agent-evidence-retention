name: R3D focused recorded-XPath anomaly and generator audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-continuity-r3d.yml"
      - "scripts/weblinx_continuity_r3d.py"
      - "tests/test_weblinx_continuity_r3d.py"
      - "docs/weblinx-continuity-r3d-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"

jobs:
  anomaly_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed source parser and locator test dependencies
        run: |
          python -m pip install 'huggingface_hub==0.36.2' 'requests==2.34.2' 'lxml==5.4.0'
          python -m pip freeze > r3d_environment.txt
      - name: Verify the original 600-row cohort and source-policy tests
        run: |
          echo "3b7b48d0dcec1f681ee3ffb4888533c76ec524cbb30130c08d493deef5add71b  results/weblinx_continuity_r3c_actions.csv" | sha256sum -c -
          python -m unittest discover -s tests -p 'test_weblinx_continuity_r3d.py' -v
          python -m compileall -q scripts
      - name: Compare the captured and DMR XPath expressions for all frozen eligible cases
        run: python scripts/weblinx_continuity_r3d.py
      - name: Verify every selected anomaly and proxy was evaluated
        run: |
          python - <<'PY'
          import csv,json
          with open('out_continuity_r3d/r3d_selected_cases.csv',newline="") as f:
              reader=csv.DictReader(f); cols=set(reader.fieldnames); rows=list(reader)
          s=json.load(open('out_continuity_r3d/r3d_summary.json'))
          assert 75<=len(rows)<=86
          assert len({(r['demo'],r['turn']) for r in rows})==len(rows)
          assert s['initial_action_locator_anomalies_n']==11
          assert s['site_native_proxy_n']==75
          assert s['selected_action_n']==len(rows)
          assert sum(s['proxy_paired_recovery'].values())==75
          assert s['independent_logical_element_identity_labels'] is False
          assert s['browser_execution_trace_evaluated'] is False
          assert cols.isdisjoint({'uid','xpath','url','html','text','site_id','source_doc','event_target'})
          print('PASS: all 11 anomalies and all 75 source-native proxy comparisons')
          PY
      - name: Hash redacted derived outputs
        if: always()
        run: |
          if test -e out_continuity_r3d/r3d_summary.json; then
            sha256sum out_continuity_r3d/r3d_summary.json out_continuity_r3d/r3d_selected_cases.csv > r3d_sha256.txt
          fi
      - name: Retain exact outcomes with no HTML or locator text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r3d-11-plus-75-audit
          path: |
            out_continuity_r3d/r3d_summary.json
            out_continuity_r3d/r3d_selected_cases.csv
            r3d_environment.txt
            r3d_sha256.txt
          retention-days: 90
          if-no-files-found: warn
