name: Source diagnosis of 84 unavailable WebLINX crops

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/missing-crop-source-audit.yml"
      - "scripts/residual_missing_crop.py"
      - "tests/test_residual_missing_crop.py"
      - "requirements.lock.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use the verified environment
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip freeze > crop_environment.txt
          diff -u requirements.lock.txt crop_environment.txt
      - name: Verify category edge cases and source cohort
        run: |
          python -m unittest discover -s tests -p test_residual_missing_crop.py -v
          echo "a1d603af041fc5dd27a52f6c4e46a29b2761a6cb5ea3fbdf801fa8485302a5e3  results/residual_70_cases_2026-11-22.csv" | sha256sum -c -
      - name: Classify source geometry for every unavailable compatible crop
        run: python scripts/residual_missing_crop.py
      - name: Verify totals and privacy-preserving output
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("out_missing_crop")
          summary=json.loads((p/"missing_crop_summary.json").read_text())
          with (p/"missing_crop_cases.csv").open(newline="") as f:
              rd=csv.DictReader(f);rows=list(rd);cols=set(rd.fieldnames)
          assert summary["affected_actions"]==29
          assert summary["missing_crop_competitors"]==84
          assert len(rows)==29 and sum(int(r["missing_visual_competitor_n"]) for r in rows)==84
          assert cols.isdisjoint({"uid","xpath","html_id","text","screenshot","url"})
          print("PASS: reconciled 84 missing crops across 29 actions")
          PY
      - name: Retain derived case reasons and exact environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-missing-crop-audit
          path: |
            out_missing_crop/missing_crop_summary.json
            out_missing_crop/missing_crop_cases.csv
            crop_environment.txt
          if-no-files-found: warn
          retention-days: 90
