name: R5B2 real Flaskr server POST with zero SQL commit negative control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-round5b2-server-rejection.yml"
      - "scripts/weblinx_round5b2_server_rejection.py"
      - "tests/test_weblinx_round5b2_server_rejection.py"
      - "docs/weblinx-round5b2-server-rejection-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UPSTREAM_FLASK_SHA: "49943b5a94413a530761350f04e896f76e8d620e"

jobs:
  real_server_rejection:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact reproducible Flaskr and Chromium environment
        run: |
          python -m pip install 'playwright==1.65.2' 'Flask==3.1.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > round5b2_environment.txt
      - name: Fetch pinned unmodified upstream blog application
        run: |
          curl -fLsS --retry 3 --connect-timeout 25 \
            "https://codeload.github.com/pallets/flask/tar.gz/${UPSTREAM_FLASK_SHA}" \
            -o official-flaskr-source.tar.gz
          mkdir -p _upstream_unpack .r5b_upstream
          tar -xzf official-flaskr-source.tar.gz -C _upstream_unpack
          cp -a "_upstream_unpack/flask-${UPSTREAM_FLASK_SHA}/examples/tutorial/flaskr" .r5b_upstream/flaskr
          rm -rf official-flaskr-source.tar.gz _upstream_unpack
      - name: Verify predetermined six rejections and exact source
        run: |
          python -m unittest discover -s tests -p 'test_weblinx_round5b2_server_rejection.py' -v
          python -m py_compile scripts/weblinx_round5b2_server_rejection.py
          python -m py_compile scripts/weblinx_round5b_flaskr.py
      - name: Submit six real browser forms to native Flaskr server validator
        run: python scripts/weblinx_round5b2_server_rejection.py
      - name: Assert server requests occurred without actual SQLite changes
        run: |
          python - <<'PY'
          import json,csv
          from collections import Counter
          with open('out_round5b2/r5b2_server_rejections_6.csv',newline='') as f:
              reader=csv.DictReader(f);cols=set(reader.fieldnames);rows=list(reader)
          s=json.load(open('out_round5b2/r5b2_server_rejection_summary.json'))
          assert len(rows)==6 and s['total_cases']==6
          assert len({(r['locator'],r['condition']) for r in rows})==6
          assert s['server_POST_count_total']==6
          assert s['server_POST_with_no_SQL_commit']==6
          assert s['post_response_codes']=={'200':6}
          assert s['flash_validation_n']==6
          assert s['all_SQL_A_unchanged'] and s['all_SQL_B_unchanged']
          assert all(r['first_click_trusted_count']=='1' for r in rows)
          assert all(r['server_edit_POST_count']=='1' and
                     r['sql_rows_changed_count']=='0' for r in rows)
          assert all(r['browser_render_matches_SQL']=='1' for r in rows)
          assert all(int(r['playwright_trace_zip_bytes'])>0 for r in rows)
          assert s['real_external_app_backend_unchanged'] is True
          assert s['raw_trace_archives_published'] is False
          assert cols.isdisjoint({'cookie','password','raw_trace','raw_html','literal_href'})
          print("R5B2_ALL_SIX_AUTHENTIC_SERVER_POST_REJECTIONS_VERIFIED")
          PY
      - name: Compare all real server and SQLite observations with first independent source run
        run: |
          python scripts/weblinx_round5b2_compare.py
          python - <<'PY'
          import json
          c=json.load(open("out_round5b2/r5b2_independent_comparison.json"))
          assert c["cases"]==6 and c["different_fields"]==0
          assert c["all_six_real_POSTs_rejected_without_SQL_change"]
          assert c["independent_db_readback_in_both_runs"]
          print("R5B2_INDEPENDENT_SIX_CASE_REPRODUCTION_PASSED")
          PY
      - name: Hash derived six-case output
        if: always()
        run: |
          if test -e out_round5b2/r5b2_server_rejection_summary.json; then
            sha256sum out_round5b2/r5b2_server_rejection_summary.json \
                      out_round5b2/r5b2_server_rejections_6.csv > round5b2_sha256.txt
          fi
      - name: Archive source-only numeric and environment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-round5b2-real-flaskr-post-no-commit
          path: |
            out_round5b2/r5b2_server_rejection_summary.json
            out_round5b2/r5b2_server_rejections_6.csv
            round5b2_environment.txt
            round5b2_sha256.txt
            out_round5b2/r5b2_independent_comparison.json
          retention-days: 90
          if-no-files-found: warn
