name: Publish R5B2 independent Flaskr POST rejection evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-weblinx-round5b2.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original externally executed 6 POST experiments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45063079721 -R risu-research/web-agent-evidence-retention -n weblinx-round5b2-real-flaskr-post-no-commit -D source_run
      - name: Verify original metrics, immutable source and source SHA
        run: |
          echo "a0dbc1fbddb16bc8ef17959428d20443761c32695cfea1e5eef354d91a7190f6  source_run/out_round5b2/r5b2_server_rejection_summary.json" | sha256sum -c -
          echo "7f3fab73f08ccfd6df670cfd5ba7847a766faa8fb0aad0b10d3a8621b1569084  source_run/out_round5b2/r5b2_server_rejections_6.csv" | sha256sum -c -
          python - <<'PY'
          import json,csv
          s=json.load(open('source_run/out_round5b2/r5b2_server_rejection_summary.json'))
          with open('source_run/out_round5b2/r5b2_server_rejections_6.csv',newline='') as f:
              rd=csv.DictReader(f);fields=set(rd.fieldnames);rows=list(rd)
          assert len(rows)==6 and s['total_cases']==6
          assert s['source_commit']=='49943b5a94413a530761350f04e896f76e8d620e'
          assert s['server_POST_count_total']==6
          assert s['server_POST_with_no_SQL_commit']==6
          assert s['post_response_codes']=={'200':6}
          assert s['all_SQL_A_unchanged'] and s['all_SQL_B_unchanged']
          assert fields.isdisjoint({'raw_trace','raw_html','cookie','password','user_data'})
          print('VALIDATED_SIX_REJECTED_SERVER_POSTS_WITH_NO_SQL_COMMIT')
          PY
      - name: Archive unchanged independent source results
        run: |
          cp source_run/out_round5b2/r5b2_server_rejection_summary.json results/weblinx_round5b2_rejection_summary.json
          cp source_run/out_round5b2/r5b2_server_rejections_6.csv results/weblinx_round5b2_rejection_cases.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_round5b2_rejection_*
          if ! git diff --cached --quiet; then
            git commit -m "Preserve six genuine Flaskr POST responses without SQLite commit"
            git push origin HEAD:main
          fi
