name: Offline reproducibility checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/offline-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/offline-checks.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and unit checks
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
