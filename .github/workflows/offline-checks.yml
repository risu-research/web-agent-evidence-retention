name: Offline reproducibility checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/offline-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/offline-checks.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned offline and source instrumentation dependencies
        run: python -m pip install Pillow==11.3.0 ImageHash==4.3.2 requests==2.34.2 lxml==5.4.0 huggingface_hub==0.36.2 playwright==1.65.2 Flask==3.1.2
      - name: Syntax and unit checks
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
