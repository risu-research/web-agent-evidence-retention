name: R4 independent-channel source continuity audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-continuity-r4.yml"
      - "scripts/weblinx_continuity_r4.py"
      - "tests/test_weblinx_continuity_r4.py"
      - "docs/weblinx-continuity-r4-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"

jobs:
  independent_channels:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact independent source dependencies
        run: |
          python -m pip install 'huggingface_hub==0.36.2' 'requests==2.34.2' 'lxml==5.4.0'
          python -m pip freeze > r4_environment.txt
      - name: Verify frozen 86-case population and blind matching tests
        run: |
          echo "234352ddb7656d7f8d8f60a65f5222fc971f37a6dea0f1b983bfb6dc54646e61  results/weblinx_continuity_r3d_cases.csv" | sha256sum -c -
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_weblinx_continuity_r4.py' -v
      - name: Fetch pinned HTML sources and evaluate ID-blinded semantic evidence
        run: python scripts/weblinx_continuity_r4.py
      - name: Validate every source case and privacy boundaries
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          p='out_continuity_r4/'
          with open(p+'r4_semantic_cases_86.csv',newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f);fields=set(reader.fieldnames);rows=list(reader)
          s=json.load(open(p+'r4_semantic_summary.json',encoding='utf-8'))
          assert len(rows)==s['case_count']==86
          assert len({(r['demo'],r['turn']) for r in rows})==86
          assert Counter(r['group'] for r in rows)=={
              'source_xpath_anomaly':11,'captured_only_8':8,'both_67':67}
          assert s['anomalies_11']['n']==11
          assert s['captured_only_8']['n']==8
          assert s['both_67']['n']==67
          assert s['all_proxy_75']['n']==75
          assert sum(s['all_proxy_75']['blinded_semantic_outcomes'].values())==75
          assert s['identity_label_status']=='SOURCE_SEMANTIC_CORROBORATION_ONLY'
          assert s['source_native_id_proxy_independently_adjudicated'] is False
          assert s['browser_action_recipient_independently_logged'] is False
          assert fields.isdisjoint({'uid','xpath','url','html','text','site_id','href','raw_html','source_doc',
                                    'action_value','event_target','screenshot','label_text','account'})
          print('R4_ALL_CASES_ACCOUNTED_FOR',len(rows),s['all_proxy_75']['blinded_semantic_outcomes'])
          PY
      - name: Hash R4 original outputs
        if: always()
        run: |
          if test -e out_continuity_r4/r4_semantic_summary.json; then
            sha256sum out_continuity_r4/r4_semantic_summary.json out_continuity_r4/r4_semantic_cases_86.csv > r4_sha256.txt
          fi
      - name: Retain derived evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r4-id-blinded-semantics
          path: |
            out_continuity_r4/r4_semantic_summary.json
            out_continuity_r4/r4_semantic_cases_86.csv
            r4_environment.txt
            r4_sha256.txt
          if-no-files-found: warn
          retention-days: 90
