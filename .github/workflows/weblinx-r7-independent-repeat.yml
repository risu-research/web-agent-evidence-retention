name: R7 independent full 48-case DOM auditor repeat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r7-independent-repeat.yml"
      - "scripts/weblinx_r7_compare_repeats.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  independent_repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install identical Django and Playwright browser runtime
        run: |
          python -m pip install 'Django==5.2.12' 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > r7_repeat_environment.txt
      - name: Fix original accepted source casebook byte for byte
        run: |
          echo "2a72e1fae82360ca0ef255a6e00cbc6895ed0772048b80c1ea0fde0a5efa749c  results/weblinx_r7_DOM_vs_packets_summary.json" | sha256sum -c -
          echo "706fbd149da6de28fb62c28bb9d10dc531a1aff60022cb2e6e82fc6a604c77da  results/weblinx_r7_DOM_vs_packets_48.csv" | sha256sum -c -
          mkdir -p r7_first/out_round7 r7_repeat/out_round7
          cp results/weblinx_r7_DOM_vs_packets_summary.json r7_first/out_round7/r7_trace_DOM_vs_packets_summary.json
          cp results/weblinx_r7_DOM_vs_packets_48.csv r7_first/out_round7/r7_trace_DOM_vs_packets_48.csv
      - name: Independently re-execute all 48 Django browser and raw DOM Trace comparisons
        run: |
          python -m unittest discover -s tests -p 'test_weblinx_r7_trace_dom_auditor.py' -v
          python scripts/weblinx_r7_compare_auditors.py
          cp out_round7/r7_trace_DOM_vs_packets_summary.json r7_repeat/out_round7/r7_trace_DOM_vs_packets_summary.json
          cp out_round7/r7_trace_DOM_vs_packets_48.csv r7_repeat/out_round7/r7_trace_DOM_vs_packets_48.csv
      - name: Compare exactly every nonvolatile original source, DOM and packet verdict
        run: |
          python scripts/weblinx_r7_compare_repeats.py
          python - <<'PY'
          import json
          x=json.load(open('results/weblinx_r7_independent_repeat.json'))
          assert x['cases']==48
          assert x['different_fields_n']==0
          assert x['initial_scores']==x['repeat_scores']
          for q in ('Q2_visible_click_row','Q3_server_mutating_POST','Q4_SQLite_effect','Q5_first_click_status'):
              assert x['repeat_scores']['trace'][q]['correct']==48
          print('PASS: 48 genuine independently reexecuted DOM Trace audited cases, no categorical mismatches')
          PY
      - name: Preserve independent repeat outcomes without raw Trace
        run: |
          sha256sum out_round7/r7_trace_DOM_vs_packets_summary.json \
                    out_round7/r7_trace_DOM_vs_packets_48.csv > r7_repeat_sha256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_r7_independent_repeat.json
          if ! git diff --cached --quiet; then
            git commit -m "Record independent R7 48-case DOM Trace and packet audit parity with native Trace byte drift"
            git push origin HEAD:main
          fi
      - name: Archive both-case explicit results and evidence provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r7-repeated-blind-dom-audit
          path: |
            out_round7/r7_trace_DOM_vs_packets_summary.json
            out_round7/r7_trace_DOM_vs_packets_48.csv
            results/weblinx_r7_independent_repeat.json
            r7_repeat_environment.txt
            r7_repeat_sha256.txt
          retention-days: 90
          if-no-files-found: warn
