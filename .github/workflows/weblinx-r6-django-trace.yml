name: R6 second web app Django admin real SQLite and raw Trace audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r6-django-trace.yml"
      - "scripts/weblinx_r6_django_trace.py"
      - "docs/weblinx-r6-django-trace-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  django_second_app:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned second web application and real Chromium
        run: |
          python -m pip install 'Django==5.2.12' 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > r6_environment.txt
      - name: Verify official Django tag commit and unmodified installed admin code
        run: |
          mkdir -p /tmp/r6_upstream
          curl -fLsS --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/django/django/4f382ca672f86dd4a1e4d071c91d0caad0e124b3/django/contrib/auth/admin.py" \
            -o /tmp/r6_upstream/admin.py
          curl -fLsS --retry 3 --connect-timeout 20 \
            "https://raw.githubusercontent.com/django/django/4f382ca672f86dd4a1e4d071c91d0caad0e124b3/django/contrib/admin/options.py" \
            -o /tmp/r6_upstream/options.py
          python - <<'PY'
          from pathlib import Path
          import django
          assert django.get_version()=="5.2.12"
          p=Path(django.__file__).parent
          pairs=[
            (p/"contrib/auth/admin.py",Path("/tmp/r6_upstream/admin.py")),
            (p/"contrib/admin/options.py",Path("/tmp/r6_upstream/options.py"))
          ]
          for installed,source in pairs:
              assert installed.read_bytes()==source.read_bytes(),f"Installed Django diverges from official source: {installed}"
              print("UPSTREAM_SOURCE_MATCH",installed.name,len(source.read_bytes()))
          PY
      - name: Confirm frozen 48 cases and source Python syntax
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from weblinx_r6_django_trace import matrix,OPS,LOCATORS,CONDITIONS
          rows=matrix()
          assert len(rows)==48 and len(set(rows))==48
          assert len(OPS)==2 and len(LOCATORS)==3 and len(CONDITIONS)==8
          print("R6_FIXED_48_CASE_MATRIX")
          PY
          python -m py_compile scripts/weblinx_r6_django_trace.py
      - name: Execute original Django admin browser, WSGI and SQLite audit
        run: python scripts/weblinx_r6_django_trace.py
      - name: Validate complete Django 48-case record and raw Trace provenance
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          p='out_round6/'
          with open(p+'r6_django_48.csv',newline='',encoding='utf-8') as f:
              rd=csv.DictReader(f);fields=set(rd.fieldnames);rows=list(rd)
          s=json.load(open(p+'r6_django_summary.json',encoding='utf-8'))
          assert s['predeclared_cases']['count']==len(rows)==48
          assert len({(r['operation'],r['locator'],r['condition']) for r in rows})==48
          assert Counter(r['operation'] for r in rows)=={'edit':24,'delete':24}
          assert Counter(r['locator'] for r in rows)=={
              'positional':16,'href_exact':16,'contextual_row':16}
          assert s['runtime']['django']=='5.2.12'
          assert s['upstream_tag_commit']=='4f382ca672f86dd4a1e4d071c91d0caad0e124b3'
          assert all(r['render_matches_SQL']=='1' for r in rows)
          assert all(int(r['trace_zip_bytes'])>0 for r in rows)
          assert all(int(r['trace_event_lines'])>0 for r in rows)
          assert all(r['sqlite_effect_record'] in ('A','B','none') for r in rows)
          assert all(r['sqlite_effect_record']=='A' and r['first_click_status']=='returned'
                     for r in rows if r['condition']=='baseline')
          assert all(r['sqlite_effect_record']=='none'
                     for r in rows if r['condition']=='overlay_standard')
          assert s['trace']['server_POST_record_correct_n']==48
          assert s['raw_trace_published'] is False
          assert fields.isdisjoint({'password','cookie','session','raw_trace','raw_html',
                                    'url','raw_selector','sqlite_dump','private_key'})
          print("R6_48_DJANGO_REAL_DB_CASES_VALIDATED",s['total'])
          PY
      - name: Hash complete derived source results
        if: always()
        run: |
          if test -e out_round6/r6_django_summary.json; then
            sha256sum out_round6/r6_django_summary.json out_round6/r6_django_48.csv > r6_sha256.txt
          fi
      - name: Archive only categorical results and original source checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r6-django-real-db-trace
          path: |
            out_round6/r6_django_summary.json
            out_round6/r6_django_48.csv
            r6_environment.txt
            r6_sha256.txt
          retention-days: 90
          if-no-files-found: warn
