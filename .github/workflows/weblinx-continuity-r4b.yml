name: R4B recorded XPath exact native-ID root audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-continuity-r4b.yml"
      - "scripts/weblinx_continuity_r4b.py"
      - "tests/test_weblinx_continuity_r4b.py"
      - "docs/weblinx-continuity-r4b-protocol.md"
      - "results/weblinx_continuity_r4_cases.csv"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DATASETS_DISABLE_PROGRESS_BARS: "1"

jobs:
  lexical_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin source metadata environment
        run: |
          python -m pip install 'huggingface_hub==0.36.2' 'requests==2.34.2' 'lxml==5.4.0'
          python -m pip freeze > r4b_environment.txt
      - name: Confirm original R4 source casebook and XPath syntax tests
        run: |
          echo "1ba4e6d6bdc0c5060f693a201bbe0d7696fef7ae27d89bc9f3da361eb271494d  results/weblinx_continuity_r4_cases.csv" | sha256sum -c -
          python -m unittest discover -s tests -p 'test_weblinx_continuity_r4b.py' -v
          python -m compileall -q scripts
      - name: Verify captured replay root ID terminal expressions on all 86 cases
        run: python scripts/weblinx_continuity_r4b.py
      - name: Verify independent run recreates exact R4B results
        run: |
          echo "957fedbe94d53cc538dba340f1f8343d98b5a3dc9ea7d9f0f41e569c5a092f7e  out_continuity_r4b/r4b_xpath_root_summary.json" | sha256sum -c -
          echo "96845e26767d49356437a87c92bff03ef892986e2f422b06146ec9d785e34480  out_continuity_r4b/r4b_xpath_root_cases_86.csv" | sha256sum -c -
      - name: Validate source-population and syntax outcome metadata
        run: |
          python - <<'PY'
          import csv,json
          with open('out_continuity_r4b/r4b_xpath_root_cases_86.csv',newline='') as f:
              reader=csv.DictReader(f);columns=set(reader.fieldnames);rows=list(reader)
          s=json.load(open('out_continuity_r4b/r4b_xpath_root_summary.json'))
          assert len(rows)==86 and s['selected_cases']==86
          assert s['groups']['all_proxy_75']['actions']==75
          assert s['groups']['source_xpath_anomaly']['actions']==11
          assert s['independent_target_identity_ground_truth'] is False
          assert s['browser_execution_verified'] is False
          assert columns.isdisjoint({'uid','xpath','url','html','text','site_id',
                                     'literal_id','screenshot','source_doc'})
          print('PASS: R4B exact-terminal source expression counts')
          PY
      - name: Hash original source expression results
        if: always()
        run: |
          if test -e out_continuity_r4b/r4b_xpath_root_summary.json; then
            sha256sum out_continuity_r4b/r4b_xpath_root_summary.json out_continuity_r4b/r4b_xpath_root_cases_86.csv > r4b_sha256.txt
          fi
      - name: Retain numeric source expression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r4b-terminal-id-root
          path: |
            out_continuity_r4b/r4b_xpath_root_summary.json
            out_continuity_r4b/r4b_xpath_root_cases_86.csv
            r4b_environment.txt
            r4b_sha256.txt
          retention-days: 90
          if-no-files-found: warn
