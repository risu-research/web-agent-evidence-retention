name: R6 five-question Trace versus independent evidence audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r6-audit-questions.yml"
      - "scripts/weblinx_r6_audit_matrix.py"
      - "results/weblinx_r6_django_cases.csv"
      - "results/weblinx_round5b_flaskr_cases.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  question_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original Django 48 actions and Flaskr benchmark frozen
        run: |
          echo "00b13fb0591562c9cef4ffe609878e6dc7f8f2ba07de90dc8887050df0d6e6a3  results/weblinx_r6_django_cases.csv" | sha256sum -c -
          echo "c3959fd7a7867e434d3a35932a421343b8998f6f2dd0688ea042e3f608b858f3  results/weblinx_round5b_flaskr_cases.csv" | sha256sum -c -
      - name: Score all five audit questions using source-derived Trace outcomes
        run: python scripts/weblinx_r6_audit_matrix.py
      - name: Verify each declared evidence source and exact result accounting
        run: |
          python - <<'PY'
          import json,csv
          p='results/weblinx_r6_audit_matrix.json'
          d=json.load(open(p))
          q=d['questions']
          assert d['cases']==48
          assert q['Q1_attempted_locator_expression']['trace_selector_explicit_n']==48
          assert q['Q2_trusted_event_receiver_row']['trace_explicit_trusted_event_row_n']==0
          assert q['Q2_trusted_event_receiver_row']['compact_independent_capture_available_n']==48
          assert q['Q3_actual_mutating_HTTP_route']['trace_answered_n']==48
          assert q['Q3_actual_mutating_HTTP_route']['trace_correct_n']==48
          assert q['Q4_independent_committed_SQLite_row']['trace_explicit_SQLite_oracle_n']==0
          assert q['Q4_independent_committed_SQLite_row']['compact_separate_SQL_readback_n']==48
          assert q['Q5_first_locator_return_or_error']['trace_answered_n']==48
          assert q['Q5_first_locator_return_or_error']['trace_correct_n']==48
          assert d['two_external_apps']['django_admin_48']==d['two_external_apps']['flaskr_48']
          with open('results/weblinx_r6_audit_cases.csv',newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f); cols=set(reader.fieldnames); rows=list(reader)
          assert len(rows)==48
          assert cols.isdisjoint({'password','cookie','raw_trace','raw_html','url','raw_selector','source_html'})
          print('R6_AUDIT_48_CASES_FIVE_QUESTIONS_VERIFIED')
          PY
      - name: Commit categorical evidence-only question report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_r6_audit_matrix.json results/weblinx_r6_audit_cases.csv
          if ! git diff --cached --quiet; then
            git commit -m "Score five audit questions against actual parsed Django Trace, WSGI and SQL evidence"
            git push origin HEAD:main
          fi
