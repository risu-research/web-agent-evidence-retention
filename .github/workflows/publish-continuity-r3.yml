name: Preserve R3 original action-source provenance results

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-continuity-r3.yml"

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original verified 600-action R3 outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45056865263 -R risu-research/web-agent-evidence-retention -n weblinx-original-action-continuity-r3 -D source_run
      - name: Verify original source output hashes, exact cohort and safe schema
        run: |
          echo "5d23045538a56bcf4faa1b9d7343fd4e75ca2585cfd33cd9e62d023b0a272c2e  source_run/out_continuity_r3/r3_summary.json" | sha256sum -c -
          echo "d82723d1b7387f9c5784ee03604231efa79fa0024f39432ed8b440a5376a417f  source_run/out_continuity_r3/r3_action_source_600.csv" | sha256sum -c -
          python - <<'PY'
          import csv,json
          p="source_run/out_continuity_r3/"
          with open(p+"r3_action_source_600.csv",newline="",encoding="utf-8") as f:
              reader=csv.DictReader(f);fields=set(reader.fieldnames);rows=list(reader)
          s=json.load(open(p+"r3_summary.json"))
          assert s["action_count"]==len(rows)==600
          assert len({(r["demo"],r["turn"]) for r in rows})==600
          assert s["numeric_totals"]["action_uid_equals_positive_uid"]==600
          assert s["numeric_totals"]["recorded_uid_equals_html_site_node"]==600
          assert s["eligible_same_site_native_id_proxy_n"]==75
          assert fields.isdisjoint({"uid","xpath","url","html","text","site_id","source_doc",
                                    "event_target","screenshot","raw_html","dialogue"})
          assert s["independent_logical_identity_ground_truth"] is False
          print("PASS: 600 public action keys and derived-only source verification")
          PY
      - name: Publish exact runner-origin files
        run: |
          cp source_run/out_continuity_r3/r3_summary.json results/weblinx_continuity_r3_summary.json
          cp source_run/out_continuity_r3/r3_action_source_600.csv results/weblinx_continuity_r3_actions.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_continuity_r3_*
          if ! git diff --cached --quiet; then
            git commit -m "Archive SHA-checked R3 600-action source and native id proxy measurements"
            git push origin HEAD:main
          fi
