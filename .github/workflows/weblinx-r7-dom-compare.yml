name: R7 real DOM Trace and selective evidence auditor 48-case comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r7-dom-compare.yml"
      - "scripts/weblinx_r7_trace_dom_auditor.py"
      - "scripts/weblinx_r7_compare_auditors.py"
      - "tests/test_weblinx_r7_trace_dom_auditor.py"
      - "docs/weblinx-r7-dom-auditor-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real_48:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact original Django Admin and Chromium
        run: |
          python -m pip install 'Django==5.2.12' 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > r7_environment.txt
      - name: Check snapshot reference reconstruction against independent synthetic model
        run: |
          python -m unittest discover -s tests -p 'test_weblinx_r7_trace_dom_auditor.py' -v
          python -m py_compile scripts/weblinx_r7_trace_dom_auditor.py scripts/weblinx_r7_compare_auditors.py
      - name: Run real 48 Django browser traces and isolated auditors
        run: python scripts/weblinx_r7_compare_auditors.py
      - name: Validate all cases, score accounting and source privacy
        run: |
          python - <<'PY'
          import csv,json
          from collections import Counter
          p='out_round7/'
          with open(p+'r7_trace_DOM_vs_packets_48.csv',newline='') as f:
              reader=csv.DictReader(f);columns=set(reader.fieldnames);rows=list(reader)
          s=json.load(open(p+'r7_trace_DOM_vs_packets_summary.json'))
          assert len(rows)==s['cases']==48
          assert len({(r['operation'],r['locator'],r['condition']) for r in rows})==48
          assert Counter(r['operation'] for r in rows)=={'edit':24,'delete':24}
          assert Counter(r['locator'] for r in rows)=={'positional':16,'href_exact':16,'contextual_row':16}
          assert s['original_source_effect_counts']=={'A':16,'B':8,'none':24}
          assert s['tier_auditors_evaluated_with_no_trace_input']
          assert s['trace_auditor_evaluated_with_no_oracle_input']
          assert s['raw_trace_ZIP_published'] is False
          assert all(r['authentic_DB_state_verified']=='1' for r in rows)
          assert all(r['truth_SQLite_effect']=='A' for r in rows if r['condition']=='baseline')
          assert all(r['truth_SQLite_effect']=='none' for r in rows if r['condition']=='overlay_standard')
          assert all(int(r['native_trace_zip_bytes'])>0 for r in rows)
          assert s['DOM_snapshot_totals']['recorded']>0
          for layer in ('trace','event','server','effect'):
              for q,values in s['evaluations'][layer].items():
                  assert sum(values[x] for x in ('correct','wrong','abstain'))==48
          assert columns.isdisjoint({'cookie','password','session','raw_trace','raw_html',
                                     'url','literal_selector','sql_dump','DOM_snapshot'})
          print('R7_ALL_48_VERIFIED',s['DOM_snapshot_totals'],s['evaluations'])
          PY
      - name: Hash actual independent source and derived scoring results
        if: always()
        run: |
          if test -e out_round7/r7_trace_DOM_vs_packets_summary.json; then
            sha256sum out_round7/r7_trace_DOM_vs_packets_summary.json out_round7/r7_trace_DOM_vs_packets_48.csv > r7_sha256.txt
          fi
      - name: Archive derived category and bytes only, no raw Trace or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r7-blind-dom-trace-vs-packet
          path: |
            out_round7/r7_trace_DOM_vs_packets_summary.json
            out_round7/r7_trace_DOM_vs_packets_48.csv
            r7_environment.txt
            r7_sha256.txt
          retention-days: 90
          if-no-files-found: warn
