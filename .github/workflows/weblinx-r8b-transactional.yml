name: R8B prospective transactional browser Trace and independent SQL contrast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weblinx-r8b-transactional.yml"
      - "scripts/weblinx_r8b_transactional.py"
      - "scripts/weblinx_r8_server_divergence.py"
      - "tests/test_weblinx_r8b_transactional.py"
      - "docs/weblinx-r8b-transactional-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r8b:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream Django and real Chromium trace recorder
        run: |
          python -m pip install 'Django==5.2.12' 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
          python -m pip freeze > r8b_environment.txt
      - name: Run unchanged R7 tests and prospectively corrected R8B comparator tests
        run: |
          python -m unittest discover -s tests -p 'test_weblinx_r7_trace_dom_auditor.py' -v
          python -m unittest discover -s tests -p 'test_weblinx_r8_server_divergence.py' -v
          python -m unittest discover -s tests -p 'test_weblinx_r8b_transactional.py' -v
          python -m py_compile scripts/weblinx_r8_server_divergence.py scripts/weblinx_r8b_transactional.py
      - name: Execute fresh 12 native Django / Playwright browser cases and hidden SQL oracle
        run: python scripts/weblinx_r8b_transactional.py
      - name: Check 6 paired observational-equivalence gates and retained failure provenance
        run: |
          python - <<'PY'
          import csv,json,collections
          p='out_round8b/'
          s=json.load(open(p+'r8b_summary.json'))
          with open(p+'r8b_12_source_cases.csv',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==s['cases']==12
          assert s['equivalent_pairs']==s['matched_pairs']==6
          assert s['transactional_network_pairs_equal']==6
          assert s['pairs_with_distinct_SQL_effect']==6
          assert s['packet_Q6_correct']==12
          assert s['trace_Q6']=={'abstain':12}
          assert s['snapshot_totals']['failures']==0
          assert s['raw_native_trace_identical'] is False
          assert s['raw_trace_published'] is False
          assert s['raw_screenshots_published'] is False
          assert set(s['R8_failed_run_ids'])=={45068631082,45068796349,45068811353,45068961921}
          assert all(x['q2_click']==x['q3_POST']==x['q4_UI_effect']=='A' for x in rows)
          assert collections.Counter(x['q6_truth'] for x in rows)=={'changed':6,'unchanged':6}
          assert all(x['equivalent'] for x in s['pair_details'])
          print('R8B_COMPLETE_SIX_PAIRS_VALID',s['strict_all_admin_network_pairs_equal'],
                s['auxiliary_network_pairs_equal'])
          PY
      - name: SHA-256 of only derived non-sensitive original-run outputs
        if: always()
        run: |
          if test -f out_round8b/r8b_summary.json; then
            sha256sum out_round8b/r8b_summary.json out_round8b/r8b_12_source_cases.csv > r8b_sha256.txt
          fi
      - name: Archive derived verdicts and hash manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblinx-r8b-original-django-transactional-contrast
          path: |
            out_round8b/r8b_summary.json
            out_round8b/r8b_12_source_cases.csv
            r8b_sha256.txt
            r8b_environment.txt
          if-no-files-found: warn
          retention-days: 90
