name: Publish recovered R7 independent repeat parity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-weblinx-r7-repeat.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve completed second full 48-case R7 execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45067470635 -R risu-research/web-agent-evidence-retention -n weblinx-r7-repeated-blind-dom-audit -D source
      - name: Validate independently produced repeat result integrity
        run: |
          echo "6e766f5dcd5f6f374c5e4bcbc3e191a203a13b25d6800b8aeac39d62054a6860  source/results/weblinx_r7_independent_repeat.json" | sha256sum -c -
          echo "538dc8767062d83f18011e0b9a2679699fa422bcdae7d595d8b25e92ac6f095c  source/out_round7/r7_trace_DOM_vs_packets_summary.json" | sha256sum -c -
          echo "aaaef1780e40265148d5f27d0f8488b5c36057007335a13894e28f6a079fd8e3  source/out_round7/r7_trace_DOM_vs_packets_48.csv" | sha256sum -c -
          python - <<'PY'
          import json
          d=json.load(open("source/results/weblinx_r7_independent_repeat.json"))
          assert d['cases']==48
          assert d['different_fields_n']==0
          assert d['stable_fields_compared_per_case']==50
          assert d['initial_scores']==d['repeat_scores']
          assert d['initial_native_trace_zip_bytes']==1655362
          assert d['repeat_native_trace_zip_bytes']==1654963
          print('R7_TWO_FULL_SOURCE_RUNS_VERIFIED')
          PY
      - name: Commit source-hash-verified comparison with GitHub rebase safety
        run: |
          cp source/results/weblinx_r7_independent_repeat.json results/weblinx_r7_independent_repeat.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_r7_independent_repeat.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve R7 two-run equality on 50 stable fields per case with real Trace ZIP drift"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "R7_REPEAT_COMPARISON_PUBLISHED attempt=$attempt"
                exit 0
              fi
              echo "Concurrent document commit detected, retrying serialized publication attempt=$attempt"
              sleep 2
            done
            echo "Unable to publish after eight safe fetch/rebase retries" >&2
            exit 1
          fi
