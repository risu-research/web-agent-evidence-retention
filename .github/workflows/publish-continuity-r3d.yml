name: Preserve R3D original XPath attribution and paired comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-continuity-r3d.yml"

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified focused R3D source measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45057674650 -R risu-research/web-agent-evidence-retention -n weblinx-r3d-11-plus-75-audit -D original
      - name: Check immutable derived outputs and source selection
        run: |
          echo "66a8e5767d58a0fe6eb4c5560841c424202dbbeb6a7e6653eee25af06454a158  original/out_continuity_r3d/r3d_summary.json" | sha256sum -c -
          echo "234352ddb7656d7f8d8f60a65f5222fc971f37a6dea0f1b983bfb6dc54646e61  original/out_continuity_r3d/r3d_selected_cases.csv" | sha256sum -c -
          python - <<'PY'
          import csv,json
          root='original/out_continuity_r3d/'
          s=json.load(open(root+'r3d_summary.json'))
          with open(root+'r3d_selected_cases.csv',newline='',encoding='utf-8') as f:
              reader=csv.DictReader(f);fields=set(reader.fieldnames); rows=list(reader)
          assert s['selected_action_n']==len(rows)==86
          assert s['initial_action_locator_anomalies_n']==11
          assert s['site_native_proxy_n']==75
          assert s['proxy_paired_recovery']=={'both':67,'replay_only':8}
          assert s['original_anomaly_root_anchor_statuses']=={'root_anchor_absent':7,'root_anchor_unique':4}
          assert s['independent_logical_element_identity_labels'] is False
          assert fields.isdisjoint({'uid','xpath','url','html','text','site_id','source_doc','event_target'})
          print('PASS: 86 fixed cases, 11 expression diagnostics, 75 paired source-proxy outcomes')
          PY
      - name: Publish derived-only R3D experiment
        run: |
          cp original/out_continuity_r3d/r3d_summary.json results/weblinx_continuity_r3d_summary.json
          cp original/out_continuity_r3d/r3d_selected_cases.csv results/weblinx_continuity_r3d_cases.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/weblinx_continuity_r3d_*
          if ! git diff --cached --quiet; then
            git commit -m "Archive SHA-checked captured vs canonical XPath proxy study"
            git push origin HEAD:main
          fi
